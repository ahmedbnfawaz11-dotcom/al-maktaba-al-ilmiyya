name: Deploy Arabic library app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Fetch public-domain Kitab al-Tawhid transcription
        run: python3 scripts/fetch_wikisource.py "كتاب التوحيد الذي هو حق الله على العبيد"
      - name: Fetch public-domain Kashf al-Shubuhat transcription
        run: python3 scripts/fetch_wikisource.py "كشف الشبهات"
      - name: Fetch public-domain Fadl al-Islam transcription
        run: python3 scripts/fetch_wikisource.py "فضل الإسلام"
      - name: Fetch public-domain Usul al-Iman transcription
        run: python3 scripts/fetch_wikisource.py "كتاب أصول الإيمان"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
