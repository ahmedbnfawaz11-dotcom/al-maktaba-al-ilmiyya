name: Deploy Arabic library app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Fetch public-domain Kitab al-Tawhid transcription
        run: python3 scripts/fetch_wikisource.py "كتاب التوحيد الذي هو حق الله على العبيد"
      - name: Fetch public-domain Kashf al-Shubuhat transcription
        run: python3 scripts/fetch_wikisource.py "كشف الشبهات"
      - name: Fetch public-domain Fadl al-Islam transcription
        run: python3 scripts/fetch_wikisource.py "فضل الإسلام"
      - name: Fetch public-domain Usul al-Iman transcription
        run: python3 scripts/fetch_wikisource.py "كتاب أصول الإيمان"
      - name: Fetch public-domain Masail al-Jahiliyyah transcription
        run: python3 scripts/fetch_wikisource.py "مسائل الجاهلية"
      - name: Fetch public-domain Mufid al-Mustafid transcription
        run: python3 scripts/fetch_wikisource.py "مفيد المستفيد في كفر تارك التوحيد"
      - name: Fetch public-domain Adab al-Mashy ila al-Salah transcription
        run: python3 scripts/fetch_wikisource.py "آداب المشي إلى الصلاة"
      - name: Fetch public-domain Four Legal Principles transcription
        run: python3 scripts/fetch_wikisource.py "أربع قواعد تدور الأحكام عليها"
      - name: Fetch public-domain Reply to the Rafidah transcription
        run: python3 scripts/fetch_wikisource.py "رسالة الرد على الرافضة"
      - name: Fetch public-domain Ijtihad and disagreement abridgment
        run: python3 scripts/fetch_wikisource.py "مبحث الاجتهاد والخلاف"
      - name: Fetch public-domain Abridged Prophetic Biography transcription
        run: python3 scripts/fetch_wikisource.py "مختصر سيرة الرسول صلى الله عليه وسلم"
      - name: Fetch public-domain Creed of the Saved Sect transcription
        run: python3 scripts/fetch_wikisource.py "عقيدة الفرقة الناجية أهل السنة والجماعة"
      - name: Fetch public-domain Book of Major Sins transcription
        run: python3 scripts/fetch_wikisource.py "كتاب الكبائر لمحمد بن عبد الوهاب"
      - name: Set up Shamela page importer
        run: python3 -m py_compile scripts/fetch_shamela.py
      - name: Fetch complete shurut-al-salah text from Shamela
        run: python3 scripts/fetch_shamela.py 11266 "shurut-al-salah" "شروط الصلاة وأركانها وواجباتها" 1000
      - name: Fetch complete kitab-al-taharah-shamela text from Shamela
        run: python3 scripts/fetch_shamela.py 8383 "kitab-al-taharah-shamela" "كتاب الطهارة" 2000
      - name: Fetch complete ahkam-tamanni-al-mawt text from Shamela
        run: python3 scripts/fetch_shamela.py 7489 "ahkam-tamanni-al-mawt" "أحكام تمني الموت" 1500
      - name: Fetch complete fatawa-wa-masail text from Shamela
        run: python3 scripts/fetch_shamela.py 11324 "fatawa-wa-masail" "فتاوى ومسائل" 5000
      - name: Fetch complete khutab-minbariyya text from Shamela
        run: python3 scripts/fetch_shamela.py 7612 "khutab-minbariyya" "الخطب المنبرية" 2500
      - name: Fetch complete fawaid-hudaybiyya text from Shamela
        run: python3 scripts/fetch_shamela.py 11070 "fawaid-hudaybiyya" "بعض فوائد صلح الحديبية" 800
      - name: Fetch complete tafsir-ayat-min-al-quran text from Shamela
        run: python3 scripts/fetch_shamela.py 11099 "tafsir-ayat-min-al-quran" "تفسير آيات من القرآن الكريم" 10000
      - name: Fetch complete mukhtasar-tafsir-al-anfal text from Shamela
        run: python3 scripts/fetch_shamela.py 11383 "mukhtasar-tafsir-al-anfal" "مختصر تفسير سورة الأنفال" 1000
      - name: Fetch complete fadael-al-quran text from Shamela
        run: python3 scripts/fetch_shamela.py 11328 "fadael-al-quran" "فضائل القرآن" 1000
      - name: Fetch complete Mukhtasar Zad al-Maad text from Shamela
        continue-on-error: true
        run: python3 scripts/fetch_shamela.py 5921 "mukhtasar-zad-al-maad" "مختصر زاد المعاد" 12000
      - name: Fetch complete Mukhtasar al-Insaf and al-Sharh al-Kabir text from Shamela
        continue-on-error: true
        run: python3 scripts/fetch_shamela.py 1685 "mukhtasar-al-insaf" "مختصر الإنصاف والشرح الكبير" 30000
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
